server {
	listen 127.0.0.1:8080;
	listen 0.0.0.0:8081;
	root www;
	index index.html;
	client_max_body_size 10485760;
	
	error_page 404 /404.html;
	error_page 500 /500.html;
	
	location /uploads {
		methods GET POST DELETE;
		upload_store www/uploads;
		autoindex on;
	}
	
	location /cgi {
		cgi_pass .py /usr/bin/python3;
		cgi_pass .php /usr/bin/php;
		methods GET POST;
	}
	
	location /redirect {
		return /index.html;
	}
}
