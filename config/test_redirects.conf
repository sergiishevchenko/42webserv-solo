server {
	listen 127.0.0.1:8080;
	root www;
	index index.html;
	client_max_body_size 10485760;
	
	# Basic redirect (302 default)
	location /redirect {
		return /index.html;
	}
	
	# Permanent redirect (301)
	location /permanent {
		return 301 /index.html;
	}
	
	# Temporary redirect (302 explicit)
	location /temporary {
		return 302 /index.html;
	}
	
	# External redirect
	location /external {
		return 302 http://example.com;
	}
	
	# Redirect to different path
	location /old-page {
		return 301 /index.html;
	}
}
